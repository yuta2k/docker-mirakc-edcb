# compose.override.yml の見本です。compose.override.yml にコピーして、環境に合わせて編集してください。
# compose.override.yml は compose.yml に自動で重ねて読み込まれます(git 管理外)。
#
# 重ね方の決まり:
# - devices、volumes は compose.yml の定義に追加されます
# - environment は同じ変数名なら上書き、無ければ追加されます
# - ports は追加されます。置き換えたいときは `ports: !override` と書きます
#
# 必要な部分だけを残し、ほかは消してかまいません。
# 書いた内容は `docker compose config` で確認できます。

services:
  mirakc:
    # チューナデバイスを指定する
    # devices:
    #   - /dev/dvb:/dev/dvb
    #   - /dev/pt3video0
    #   - /dev/pt3video1
    #   - /dev/pt3video2
    #   - /dev/pt3video3
    #   # カードリーダー(B-CAS)。コンテナ内の pcscd を使う場合(既定)は、USB デバイスを渡す。
    #   # ホストの pcscd を使う場合は不要
    #   - /dev/bus/usb:/dev/bus/usb
    # ホストの pcscd を使う場合は、ソケットをマウントする(コンテナ内の pcscd は起動しなくなる)。
    # ホストとコンテナの pcsc-lite の版が離れていると通信できないことがある(起動時のログに版が出る)
    # (ホストに pcscd が無いときに、Docker が同名のディレクトリを作らずエラーにする書き方)
    # volumes:
    #   - type: bind
    #     source: /run/pcscd/pcscd.comm
    #     target: /run/pcscd/pcscd.comm
    #     bind:
    #       create_host_path: false
    # カードリーダーを使わない場合など、コンテナ内の pcscd を起動しないようにするには
    # environment:
    #   - DISABLE_PCSCD=1
    # mirakc のポートをホストに公開する場合
    # ports:
    #   - 40772:40772

  # 同梱の mirakc を使わない(外部の mirakc / Mirakurun を使う)場合は、上の mirakc の設定を消して、
  # 次の 2 行を有効にする。edcb の MIRAKC_ADDRESS / MIRAKC_PORT も接続先に合わせて指定する
  # mirakc:
  #   profiles: [disabled]

  edcb:
    # build:
    #   args:
    #     # Write_Default.so.ini の Prealloc の既定値 (Setup.md 参照)
    #     - EDCB_PREALLOC_DEFAULT=2
    # Intel のハードウェアエンコード(QSV / VA-API)を使う場合は、見本の Dockerfile で拡張したイメージを使い、
    # /dev/dri を渡す(amd64 のみ。使える GPU は edcb/hwaccel/intel/Dockerfile のコメント参照)。
    # /dev/dri/renderD* の所有グループは自動で引き継がれるので、group_add は要らない。
    # 上の build: とは同時に書けない(EDCB_PREALLOC_DEFAULT は、元のイメージを自分でビルドするときに指定する)
    # build:
    #   context: edcb/hwaccel/intel
    #   args:
    #     # 拡張する元のイメージ(既定は配布イメージ)
    #     - BASE_IMAGE=ghcr.io/yuta2k/docker-mirakc-edcb/edcb:latest
    #     # QSVEncC も入れる場合は版を指定する(https://github.com/rigaya/QSVEnc/releases)
    #     - QSVENCC_VERSION=8.32
    # devices:
    #   - /dev/dri
    # HTTPS(edcb/ini/ssl_cert.pem を置いた場合。コンテナ内は 5511)と、EMWUI の SSE 専用ポート
    # (コンテナ内は HTTP 用 5520 / HTTPS 用 5521)を公開する場合。compose.yml の 4510 / 5510 に追加される。
    # EMWUI は SSE に「ブラウザで開いたポート + 10」を使うので、ホスト側の番号も 10 違いにする
    # (例: 2 台目の構成なら 15510:5510、15520:5520、15511:5511、15521:5521)
    # ports:
    #   - 5520:5520
    #   - 5511:5511
    #   - 5521:5521
    # 4510 / 5510 のホスト側の番号を変える場合は、.env に EDCB_HOST_HTTP_PORT=15510 のように書くか、
    # 次のように置き換える(compose.yml のポートの定義を丸ごと置き換える。上の追加分もここに書く)
    # ports: !override
    #   - 4510:4510
    #   - 5510:5510
    volumes:
      # 録画ファイルの保存先を指定する
      # - /mnt/recorded:/recorded
    # 実行ユーザは user: ではなく PUID / PGID で指定する(edcb.env-sample 参照)。
    # user: を指定すると、コンテナは起動せずにエラーで終了する
    # group_add:
    #   # 追加で渡したいグループ(録画先の共有グループなど)
    #   - "1001"
    # environment:
    #   # 外部の mirakc / Mirakurun を使う場合(edcb.env に書いてもよい)
    #   - MIRAKC_ADDRESS=192.168.0.10
    #   - MIRAKC_PORT=40772
