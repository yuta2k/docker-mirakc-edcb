# compose.override.yml の見本です。compose.override.yml にコピーして、環境に合わせて編集してください。
# compose.override.yml は compose.yml に自動で重ねて読み込まれます(git 管理外)。
#
# 重ね方の決まり:
# - devices、volumes は compose.yml の定義に追加されます
# - environment は同じ変数名なら上書き、無ければ追加されます
# - ports は追加されます。置き換えたいときは `ports: !override` と書きます
#
# 必要な部分だけを残し、ほかは消してかまいません。
# 書いた内容は `docker compose config` で確認できます。

services:
  mirakc:
    devices:
      # チューナデバイスを指定する
      # - /dev/dvb:/dev/dvb
      # - /dev/pt3video0
      # - /dev/pt3video1
      # - /dev/pt3video2
      # - /dev/pt3video3
    # mirakc のポートをホストに公開する場合
    # ports:
    #   - 40772:40772

  # 同梱の mirakc を使わない(外部の mirakc / Mirakurun を使う)場合は、上の mirakc の設定を消して、
  # 次の 2 行を有効にする。edcb の MIRAKC_ADDRESS / MIRAKC_PORT も接続先に合わせて変える
  # mirakc:
  #   profiles: [disabled]

  edcb:
    # build:
    #   args:
    #     # Write_Default.so.ini の Prealloc の既定値 (Setup.md 参照)
    #     - EDCB_PREALLOC_DEFAULT=2
    # devices:
    #   # for hardware transcoding
    #   - /dev/dri
    # ホストのポートを変える場合(compose.yml の 4510 / 5510 を置き換える)
    # ports: !override
    #   - 4510:4510
    #   - 5510:5510
    volumes:
      # 録画ファイルの保存先を指定する
      # - /mnt/recorded:/recorded
    # user: 1000:1000
    # group_add:
    #   # for hardware transcoding
    #   - video
    # environment:
    #   # 外部の mirakc / Mirakurun を使う場合
    #   - MIRAKC_ADDRESS=192.168.0.10
    #   - MIRAKC_PORT=40772
    #   - UMASK=002
