# 全員共通の定義です。このファイルは編集しないでください(git pull で更新されます)。
# チューナーのデバイス、録画先、ポートの変更など、環境ごとの設定は compose.override.yml に書きます。
# compose.override-sample.yml を compose.override.yml にコピーして編集してください。
#
# コンテナ名とボリューム名は、Compose のプロジェクト名(既定ではこのフォルダの名前)から決まります。
# 同じ名前のフォルダの構成を同じホストで 2 つ動かす場合は、片方の .env に
# COMPOSE_PROJECT_NAME=<別の名前> を書いてください。

services:
  mirakc:
    build:
      context: mirakc
    init: true
    restart: unless-stopped
    # チューナーとカードリーダーの devices は compose.override.yml に書く
    volumes:
      - mirakc-epg:/var/lib/mirakc/epg
      # ファイルが無いときに、Docker が同名のディレクトリを作らずエラーにする
      - type: bind
        source: ./mirakc/config.yml
        target: /etc/mirakc/config.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      - TZ=Asia/Tokyo
      - RUST_LOG=info

  edcb:
    build:
      context: edcb
    restart: unless-stopped
    # EDCB closes the recordings on SIGTERM. EpgTimerSrv waits up to 30 seconds
    # for each tuner process before killing it, so allow more than Docker's 10 s.
    stop_grace_period: 2m
    depends_on:
      mirakc:
        condition: service_started
        required: false
    # 設定は edcb.env に書く(edcb.env-sample 参照)。無くてもよい
    env_file:
      - path: ./edcb.env
        required: false
    # ホスト側のポートは .env の EDCB_HOST_TCP_PORT / EDCB_HOST_HTTP_PORT で変えられる。
    # HTTPS と EMWUI の SSE 専用ポートは既定では公開しない(compose.override-sample.yml 参照)
    ports:
      - ${EDCB_HOST_TCP_PORT:-4510}:4510
      - ${EDCB_HOST_HTTP_PORT:-5510}:5510
    volumes:
      - ./edcb/ini:/var/local/edcb
      # 上書き用 ini(Setup.md の「上書き用 ini」)
      - ./edcb/overrides:/etc/edcb/overrides:ro

volumes:
  mirakc-epg:
